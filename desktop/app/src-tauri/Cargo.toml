[package]
name = "ai-status-panel"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
panel-core = { path = "../crates/core" }
panel-voice = { path = "../crates/voice" }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serialport = "4.10.1"
subtle = "2.6.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
